services:

  openmu-startup:
    build:
      context: ../../src
      dockerfile: Startup/Dockerfile
    restart: "no"
    ports:
      - "8081:8080"
    volumes:
    - ../../src/Persistence/EntityFramework/ConnectionSettings.xml:/app/ConnectionSettings.xml:ro

  database:
    ports:
      - "5433:5432"
